services:
  app:
    image: ghcr.io/onebyjorah/msprex:latest
    build: .
    # Bound to localhost only. Expose to your tailnet with `tailscale serve`, never to the public internet.
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    environment:
      DEMO_MODE: ${DEMO_MODE:-true}
      PROJECT_NAME: ${PROJECT_NAME:-Project Name}
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
