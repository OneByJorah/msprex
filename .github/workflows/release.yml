name: Release

# Builds the Windows Installer package for msprex and attaches it to the GitHub
# release. Runs for tags and on demand.
#
# Signing is optional and never faked. Add these repository secrets to enable it:
#   WINDOWS_CERT_PFX_BASE64  base64 of the code-signing .pfx
#   WINDOWS_CERT_PASSWORD    its password
# Without them the package is built UNSIGNED and both the job summary and the
# release notes say so.

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    # Package on changes that can affect the installer, so the build and the
    # install smoke test are proven before the change reaches main.
    paths:
      - 'installer/**'
      - 'msprex/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package, without the leading v (for example 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  WIX_VERSION: '3.14.1'
  WIX_URL: 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip'
  WIX_SHA256: '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31'

jobs:
  package:
    name: Build + verify MSI
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.signing.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $manifest = (Select-String -Path msprex/msprex.psd1 -Pattern "^\s*ModuleVersion\s*=\s*'([0-9.]+)'").Matches[0].Groups[1].Value
          $event = '${{ github.event_name }}'
          # A pull request has no release version of its own: package what the
          # manifest says and let a tag or dispatch assert the real number.
          $raw = switch ($event) {
            'workflow_dispatch' { '${{ inputs.version }}' }
            'pull_request' { $manifest }
            default { '${{ github.ref_name }}' }
          }
          $version = $raw.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version '$raw' is not major.minor.build; MSI requires numeric versions."
          }
          if ($manifest -ne $version) {
            throw "Requested version $version does not match ModuleVersion $manifest in msprex.psd1. Bump the manifest first."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "packaging msprex $version ($event)"

      - name: Install WiX ${{ env.WIX_VERSION }}
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wix-binaries.zip'
          Invoke-WebRequest -Uri $env:WIX_URL -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:WIX_SHA256) {
            throw "WiX download checksum mismatch: expected $env:WIX_SHA256, got $actual"
          }
          $dir = Join-Path $env:RUNNER_TEMP 'wix'
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          "WIX=$dir" >> $env:GITHUB_ENV
          Write-Host "WiX in $dir"

      - name: Detect signing secrets
        id: signing
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          $enabled = -not [string]::IsNullOrWhiteSpace($env:PFX)
          "enabled=$($enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "code signing enabled: $enabled"

      - name: Build MSI
        shell: pwsh
        env:
          MSPREX_SIGN_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          # Run the build scripts as child processes: $LASTEXITCODE from a dotted
          # or call-operator .ps1 invocation is whatever the previous native
          # command left behind, which is not this script's result.
          $version = '${{ steps.version.outputs.version }}'
          $common = @('-NoProfile', '-File', './installer/build.ps1', '-WixBin', $env:WIX, '-Version', $version)
          if ('${{ steps.signing.outputs.enabled }}' -eq 'true') {
            $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            try {
              pwsh @common -SignPfx $pfx -TimestampUrl 'http://timestamp.digicert.com'
              if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed with exit code $LASTEXITCODE" }
            }
            finally {
              Remove-Item $pfx -Force -ErrorAction SilentlyContinue
            }
          }
          else {
            pwsh @common
            if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed with exit code $LASTEXITCODE" }
          }

      - name: Verify MSI structure and payload
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist/msprex-*-x64.msi | Select-Object -First 1
          pwsh -NoProfile -File ./installer/verify-msi.ps1 -Msi $msi.FullName -SourceDir msprex -WixBin $env:WIX
          if ($LASTEXITCODE -ne 0) { throw "MSI verification failed with exit code $LASTEXITCODE" }

      - name: Smoke test the packaged install
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist/msprex-*-x64.msi | Select-Object -First 1).FullName
          $log = Join-Path $env:RUNNER_TEMP 'install.log'
          $p = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$log`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content $log -Tail 40
            throw "msiexec install failed with exit code $($p.ExitCode)"
          }
          try {
            Import-Module msprex -Force -ErrorAction Stop
            $mod = Get-Module msprex
            Write-Host "loaded $($mod.Path) version $($mod.Version)"
            $expected = @('Get-MSPHost', 'Invoke-MSPDeploy', 'Test-MSPHealth', 'New-MSPClient')
            $exported = (Get-Command -Module msprex).Name
            foreach ($fn in $expected) {
              if ($exported -notcontains $fn) { throw "function $fn missing after install" }
            }
            $client = New-MSPClient -ClientName 'Smoke Test' -ContactEmail 'smoke@example.invalid'
            if ($client.Status -ne 'Active' -or $client.ClientName -ne 'Smoke Test') {
              throw 'New-MSPClient returned an unexpected object'
            }
            Write-Host 'smoke test passed'
          }
          finally {
            Remove-Module msprex -Force -ErrorAction SilentlyContinue
            $u = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
            Write-Host "uninstall exit code $($u.ExitCode)"
            if (Test-Path "$env:ProgramFiles\WindowsPowerShell\Modules\msprex") {
              throw 'module directory still present after uninstall'
            }
          }

      - name: Pack portable module
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $zip = "dist/msprex-$version-portable.zip"
          Compress-Archive -Path msprex/msprex.psd1, msprex/msprex.psm1, LICENSE, README.md -DestinationPath $zip
          Get-ChildItem dist | Format-Table Name, Length

      - name: Write checksums
        shell: pwsh
        run: |
          Push-Location dist
          Get-ChildItem -File | Where-Object { $_.Name -notlike '*.sha256' -and $_.Name -notlike '*.wixpdb' } |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } |
            Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
          Pop-Location

      - name: Job summary
        shell: pwsh
        run: |
          $signed = '${{ steps.signing.outputs.enabled }}' -eq 'true'
          $status = if ($signed) { 'Signed and timestamped (Authenticode)' } else { 'UNSIGNED — no WINDOWS_CERT_PFX_BASE64 secret configured' }
          @"
          ### msprex ${{ steps.version.outputs.version }} Windows package
          | Artifact | Status |
          | --- | --- |
          | ``msprex-${{ steps.version.outputs.version }}-x64.msi`` | $status |
          | ``msprex-${{ steps.version.outputs.version }}-portable.zip`` | not signed (zip of the module files) |
          Signature status: **$status**
          "@ >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: msprex-windows
          path: |
            dist/*.msi
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Attach to release
    needs: package
    # Never touch a release from a pull request build.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: msprex-windows
          path: dist

      - name: Upload assets to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
          SIGNED: ${{ needs.package.outputs.signed }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if [ "$SIGNED" = "true" ]; then
            status="Windows MSI is Authenticode-signed and timestamped. Verify with: signtool verify /pa msprex-${VERSION}-x64.msi"
          else
            status="**UNSIGNED BUILD.** No code-signing certificate is configured for this repository, so Windows SmartScreen will warn on first run: choose More info, then Run anyway. The checksum in SHA256SUMS.txt is the only integrity signal."
          fi

          cat > notes.md <<EOF
          ## Downloads
          - msprex-${VERSION}-x64.msi — installs the module for all users into %ProgramFiles%\WindowsPowerShell\Modules\msprex
          - msprex-${VERSION}-portable.zip — module files only, no installer
          - SHA256SUMS.txt — checksums for every file above

          $status

          Install with PowerShell: \`msiexec /i msprex-${VERSION}-x64.msi /qn\`, then \`Import-Module msprex\`.
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.msi dist/*.zip dist/SHA256SUMS.txt --clobber
            existing=$(gh release view "$tag" --json body --jq .body)
            printf '%s\n\n---\n%s\n' "$existing" "$(cat notes.md)" > merged.md
            gh release edit "$tag" --notes-file merged.md
          else
            gh release create "$tag" dist/*.msi dist/*.zip dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --title "msprex ${VERSION}" --notes-file notes.md
          fi
          gh release view "$tag" --json assets --jq '.assets[] | "- \(.name) (\(.size) bytes)"'
