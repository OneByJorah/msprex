name: PowerShell Gallery Publish
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish to PowerShell Gallery
        uses: MacBookPro-ct/powershell-gallery-publish@v1
        with:
          api_key: ${{ secrets.PSGALLERY_API_KEY }}
          module_path: msprex/
